services:
  drift-admin:
    build: .
    image: storningsgenerator-admin:local
    container_name: drift-admin
    restart: unless-stopped
    init: true
    ports:
      - "${ADMIN_PORT:-3000}:3000"   # admin HTTP (lokalt IP eller via extern proxy)
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PUBLIC_DIR=/data/public-site
      - PUBLIC_URL=${PUBLIC_URL:-}
      - PORTAL_PORT=${PORTAL_PORT:-3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - admin-net

  drift-portal:
    image: nginx:alpine
    container_name: drift-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-3001}:80"    # publik portal HTTP (lokalt IP eller via extern proxy)
    volumes:
      - ./nginx-portal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/public-site:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,nodev
      - /var/run:noexec,nosuid,nodev
      - /tmp:noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portal-net

networks:
  admin-net:
    driver: bridge
  portal-net:
    driver: bridge
