<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Logga in — Driftpuls</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/assets/tailwind.css">
</head>
<body class="bg-page text-fg min-h-screen flex items-center justify-center p-6 font-sans">
  <form id="loginForm" class="card w-full max-w-sm space-y-4">
    <div class="flex items-center gap-2.5">
      <span class="inline-block w-3 h-3 bg-brand rounded-full"></span>
      <h1 class="text-base font-bold tracking-tight">Driftpuls</h1>
    </div>
    <div>
      <label class="lbl" for="username">Användarnamn</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus class="field">
    </div>
    <div>
      <label class="lbl" for="password">Lösenord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required class="field">
    </div>
    <div id="totpBox" class="hidden space-y-1.5 pt-1 border-t border-line">
      <label class="lbl" for="totp">🔐 Tvåfaktorskod (6 siffror från Authenticator-app)</label>
      <input id="totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" class="field font-mono text-center tracking-widest text-base">
    </div>
    <p id="err" role="alert" class="text-xs text-danger min-h-[1rem]"></p>
    <button id="btn" type="submit" class="w-full bg-brand hover:bg-brand-dark disabled:opacity-50 text-white font-semibold py-3 rounded-xl transition text-sm">Logga in</button>
  </form>
  <script src="/login.js" defer></script>
</body>
</html>
